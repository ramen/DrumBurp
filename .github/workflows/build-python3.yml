name: Build DrumBurp Python 3

# This workflow builds DrumBurp with Python 3, PyQt5, and uv
# For the original Python 2 build, see build.yml

on:
  push:
    branches: [ python3-*, py3-* ]
    tags: [ 'v*-py3' ]
  pull_request:
    branches: [ python3-*, py3-* ]
  workflow_dispatch:

jobs:
  build-linux-py3:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Verify uv installation
      run: uv --version

    - name: Install Qt5 system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxcb-xinerama0 \
          libxcb-cursor0 \
          libqt5core5a \
          libqt5gui5 \
          libqt5widgets5 \
          libqt5dbus5 \
          libdbus-1-3 \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libegl1 \
          libfontconfig1

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -e ".[dev,build]"

    - name: Verify installation
      run: |
        source .venv/bin/activate
        python -c "import PyQt5.QtCore; print('PyQt5 version:', PyQt5.QtCore.PYQT_VERSION_STR)"
        python -c "import pygame; print('pygame version:', pygame.version.ver)"

    - name: Run syntax check
      run: |
        source .venv/bin/activate
        python -m py_compile src/DrumBurp.py

    - name: Run tests
      run: |
        source .venv/bin/activate
        # Run any existing unit tests
        python -m pytest src/test/ -v --tb=short || echo "⚠ Tests not yet configured for Python 3"
      continue-on-error: true

    - name: Build executable (Python 3.11 only)
      if: matrix.python-version == '3.11'
      run: |
        source .venv/bin/activate
        chmod +x build/build_executable.sh
        ./build/build_executable.sh

    - name: Test executable (Python 3.11 only)
      if: matrix.python-version == '3.11'
      run: |
        # Verify executable exists and has correct structure
        test -f dist/DrumBurp/DrumBurp || exit 1
        test -x dist/DrumBurp/DrumBurp || exit 1
        ls -lh dist/DrumBurp/

    - name: Create distribution archive (Python 3.11 only)
      if: matrix.python-version == '3.11' && startsWith(github.ref, 'refs/tags/')
      run: |
        cd dist
        tar czf DrumBurp-Linux-x86_64-py3.tar.gz DrumBurp/
        sha256sum DrumBurp-Linux-x86_64-py3.tar.gz > DrumBurp-Linux-x86_64-py3.tar.gz.sha256
        cd ..

    - name: Upload executable artifact (Python 3.11 only)
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: DrumBurp-Linux-Python3
        path: dist/DrumBurp/
        retention-days: 30

    - name: Upload distribution archive (Python 3.11 only)
      if: matrix.python-version == '3.11' && startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: DrumBurp-Linux-Distribution
        path: |
          dist/DrumBurp-Linux-x86_64-py3.tar.gz
          dist/DrumBurp-Linux-x86_64-py3.tar.gz.sha256
        retention-days: 90

    - name: Create GitHub Release
      if: matrix.python-version == '3.11' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/DrumBurp-Linux-x86_64-py3.tar.gz
          dist/DrumBurp-Linux-x86_64-py3.tar.gz.sha256
        draft: true
        generate_release_notes: true
        body: |
          # DrumBurp Python 3 Release

          This is a Python 3 compatible build of DrumBurp.

          ## What's New
          - ✅ Python 3.8+ support
          - ✅ PyQt5 instead of PyQt4
          - ✅ Modern uv-based build system
          - ✅ Standalone executable (no Python installation required)

          ## Installation

          ### Quick Start
          ```bash
          tar xzf DrumBurp-Linux-x86_64-py3.tar.gz
          ./DrumBurp/DrumBurp
          ```

          ### Building from Source
          ```bash
          ./build/build_with_uv.sh
          source .venv/bin/activate
          python src/DrumBurp.py
          ```

          See BUILD_UV.md for detailed instructions.

          ## System Requirements
          - Linux x86_64
          - Qt5 libraries (usually pre-installed)

          ## Documentation
          - README_PYTHON3.md - Quick start guide
          - BUILD_UV.md - Build instructions
          - MIGRATION_CHECKLIST.md - Technical details
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
